[project]
name = "ccrepe"
version = "0.1.0"
description = "skullduggery"
authors = [
    {name = "jmich@fastmail.nl"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "markdownify (>=1.2.2,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
isort = "^7.0.0"
mypy = "^1.19.1"
pytest = "^9.0.2"
vulture = "^2.14"


[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true